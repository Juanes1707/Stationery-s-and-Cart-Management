<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papel y Luna</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="shortcut icon" href="imagenes y recursos/Icon-Papeleria.jpg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app__container">
        <header class="header__content">
            <div class="header__content-elements">
                <img src="imagenes y recursos/Papel y Luna Logo.png" alt="Papel y Luna Logo" class="header__content-logo">
                <h1 class="header__content-title">Papel y Luna</h1>
            </div>
            <div class="header__content-input-container">
                <button class="header__content-button" aria-label="Buscar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <input type="text" id="searchInput" placeholder="Buscar producto..." class="header__content-input" autocomplete="off">
            </div>
            <div class="header__actions">
                <button class="header__actions-button" id="cartButton" aria-label="Abrir carrito">
                    <i class="fa-solid fa-cart-arrow-down"></i>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
                <button class="header__actions-button" id="profileButton" aria-label="Administracion">
                    <i class="fa-solid fa-user"></i>
                </button>
                <button class="header__actions-button" id="homeButton" aria-label="Inicio">
                    <i class="fa-solid fa-house"></i>
                </button>
                <div class="header__user-info" id="headerUserInfo" style="display:none">
                    <span class="header__role-badge" id="headerRoleBadge" style="display:none"></span>
                </div>
                <button class="header__actions-button header__logout-btn" id="logoutButton" aria-label="Cerrar sesion" title="Cerrar sesion" style="display:none">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <main class="main__content">
            <section class="main__content-section">
                <h2 class="main__content-title">Nuestros Productos</h2>
                <div class="categories__container">
                    <button class="category__button active" data-category="todos">Todos</button>
                    <button class="category__button" data-category="Cuadernos">Libretas y agendas</button>
                    <button class="category__button" data-category="Escritura">Boligrafos y lapices</button>
                    <button class="category__button" data-category="Arte">Arte y creatividad</button>
                    <button class="category__button" data-category="Organizacion">Organizacion</button>
                </div>
                <div class="main__products-container">
                </div>
            </section>

            <div class="admin-history-workspace">
                <div class="admin__panel-container">
                    <aside class="admin__panel" id="adminPanel">
                        <div class="admin__menu">
                            <button id="adminHistoryBtn"   class="admin__menu-btn active">Historial</button>
                            <button id="adminCrudBtn"       class="admin__menu-btn">Productos</button>
                            <button id="adminPurchasesBtn"  class="admin__menu-btn">Compras</button>
                            <button id="adminEntitiesBtn"   class="admin__menu-btn">Entidades</button>
                            <button id="adminDiscountsBtn"  class="admin__menu-btn">Descuentos</button>
                            <button id="adminShortagesBtn"  class="admin__menu-btn">Faltantes</button>
                            <button id="adminReportsBtn"    class="admin__menu-btn">Reportes</button>
                            <button id="adminProfileBtn"    class="admin__menu-btn">Mi cuenta</button>
                        </div>
                        <div class="admin__content" id="adminContent"></div>
                    </aside>
                </div>
                <section class="history__content" id="historySection">
                    <div class="history__content-sales"></div>
                    <div id="invoiceContainer"></div>
                </section>
            </div>

            <section class="checkout__content" id="checkoutSection">
                <div class="checkout__content-container"></div>
            </section>
        </main>

        <div class="cart-overlay" id="cartOverlay" aria-hidden="true"></div>

        <div class="cart__aside-container">
            <aside class="cart__aside" id="cart" role="complementary" aria-label="Carrito de compras">
                <h2 class="cart__aside-title">Carrito</h2>
                <div class="cart__items" id="cartItems"></div>
                <div class="empty__cart" id="emptyCartMessage"></div>
                <div class="cart__footer" id="cartFooter"></div>
            </aside>
        </div>

        <footer class="footer-content">
            <div class="footer__columns footer__columns--single">
                <div class="footer__col footer__col--about footer__col--fullwidth">
                    <h3><span class="footer__col-icon"><i class="fa-solid fa-book"></i></span>Papel y Luna</h3>
                    <p class="footer__description">Creamos herramientas para que tus ideas cobren vida.</p>
                    <div class="footer__socials">
                        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a href="https://www.instagram.com/papeleriapapelyluna/" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer__bottom">
                <p>2026 Papel y Luna. Todos los derechos reservados.</p>
            </div>
        </footer>
    </div>

    <div id="apiLoader" class="api-loader api-loader--hidden" aria-live="assertive" aria-busy="true">
        <div class="api-loader__content">
            <div class="api-loader__spinner"></div>
            <p>Cargando datos...</p>
        </div>
    </div>

    <script src="./js/auth.js"></script>
    <script src="./js/permissions.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/state.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/sales/sales.js"></script>
    <script src="./js/history.js"></script>
    <script src="./js/invoice.js"></script>
    <script src="./js/router.js"></script>
    <script src="./js/purchases.js"></script>
    <script src="./js/entities.js"></script>
    <script src="./js/management.js"></script>
    <script src="./js/admin.js"></script>
    <script src="./js/profile.js"></script>
    <script src="./js/checkout.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
