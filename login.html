<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Papel y Luna</title>
  <link rel="shortcut icon" href="imagenes y recursos/Icon-Papeleria.jpg" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="imagenes y recursos/Papel y Luna Logo.png" alt="Logo" onerror="this.style.display='none'">
      <div class="login-logo-text">
        <h1>Papel y Luna</h1>
        <p>Sistema de gestión</p>
      </div>
    </div>

    <h2>Iniciar sesión</h2>
    <p class="login-subtitle">Ingresa tus credenciales para continuar.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" name="username"
                 placeholder="Tu nombre de usuario" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" name="password"
                 placeholder="Tu contraseña" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePwd" aria-label="Mostrar contraseña">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="spinner"></span>
        <span class="btn-text"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</span>
      </button>

      <div class="login-error" id="loginError" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="loginErrorMsg">Credenciales incorrectas.</span>
      </div>
    </form>

    <div class="login-hint">
      <p>Usuarios de prueba:</p>
      <div class="hint-row">
        <span><strong>admin</strong> / admin123</span>
        <span class="role" style="color:#7c3aed">ADMIN</span>
      </div>
      <div class="hint-row">
        <span><strong>cajero</strong> / cajero123</span>
        <span class="role" style="color:#059669">USER</span>
      </div>
    </div>

  </div>

  <!-- auth.js debe ir antes que login.js porque login.js usa sus funciones -->
  <script src="./js/auth.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
